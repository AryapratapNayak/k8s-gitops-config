apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AryapratapNayak/k8s-gitops-platform.git
    targetRevision: main
    path: helm/backend

    helm:
      releaseName: backend

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true